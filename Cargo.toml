[package]
name = "sparse-chess"
version = "0.1.0"
edition = "2024"

[lib]
name = "sparse_chess"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
fast-math = "0.1.1"
fastrand = "2.4.1"
flate2 = "1.1.9"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
zerocopy = "0.8.56"
zerocopy-derive = "0.8.56"

[profile.release]
opt-level = 3
debug = true
panic = "abort"
